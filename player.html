<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>3D Player — Печь</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
    </style>
    
    <!-- Import Map: говорит браузеру, что "three" и "three/addons" — это ссылки на CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

<script type="module">
    // Теперь эти импорты будут работать, так как мы настроили importmap выше
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

    // --- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ---
    const hdrPath = 'park.hdr';          // Твой локальный файл (должен лежать рядом с html)
    const modelPath = 'model/pech.glb'; // Путь к модели
    // -------------------------------

    let scene, camera, renderer, controls, model;

    function init() {
        // 1. Сцена
        scene = new THREE.Scene();
        scene.background = null;
        scene.environment = null;

        // 2. Камера
        camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 2, 5);

        // 3. Рендерер
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(renderer.domElement);

        // 4. Орбитальное управление
        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 5. Загрузка HDRI (окружение и фон)
        const rgbeloader = new RGBELoader();
        rgbeloader.load(hdrPath, function (texture) {
            texture.mapping = THREE.EquirectangularReflectionMapping;
            scene.environment = texture;
            scene.background = texture;
        }, undefined, function (err) {
            console.error('Ошибка загрузки HDRI:', err);
            scene.background = new THREE.Color(0x222222);
        });

        // 6. Загрузка модели (ОБНОВЛЕННЫЙ БЛОК)
const gltfLoader = new GLTFLoader();
gltfLoader.load(modelPath, function (gltf) {
    model = gltf.scene;

    // 1. Авто-центрирование (как было)
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    model.position.sub(center);

    // 2. ФИКС: Ставим печь ровно на пол (Y = 0)
    model.position.y = 0; 

    // 3. ФИКС: Чуть увеличиваем масштаб, если печь слишком мелкая
    model.scale.set(1.3, 1.3, 1.3);

    scene.add(model);
}, undefined, function (err) {
    console.error('Ошибка загрузки модели:', err);
});

        // 7. Обработка ресайза окна
        window.addEventListener('resize', onWindowResize, false);
    }

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    init();
    animate();
</script>

</body>
</html>
