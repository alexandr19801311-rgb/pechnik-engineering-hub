<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>3D Плеер — Проект печи</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        body { margin: 0; overflow: hidden; background: #0d0d0d; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; user-select: none; color: #fff; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        a { text-decoration: none; color: inherit; }

        #branding {
            position: absolute; top: 20px; left: 20px; z-index: 20; display: none;
            background: rgba(13, 13, 13, 0.75); backdrop-filter: blur(12px);
            padding: 10px 16px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.08);
            color: #fff; align-items: center; gap: 12px; pointer-events: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        #branding img { height: 24px; width: auto; display: block; }
        #branding span { font-size: 16px; font-weight: 600; letter-spacing: -0.3px; }
        #branding.active { display: flex; }

        #access-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0d0d0d; z-index: 1000;
            display: flex; justify-content: center; align-items: center;
            flex-direction: column; color: #fff;
            backdrop-filter: blur(4px);
        }
        #access-screen.hidden { display: none; }
        #access-screen h1 { font-size: 26px; margin-bottom: 8px; font-weight: 600; letter-spacing: -0.5px; }
        #access-screen p { color: #888; margin-bottom: 24px; font-size: 15px; }
        
        .input-group {
            display: flex; gap: 10px; align-items: center;
            background: rgba(255,255,255,0.06); padding: 6px 6px 6px 18px;
            border-radius: 14px; border: 1px solid rgba(255,255,255,0.08);
            transition: border-color 0.2s;
        }
        .input-group:focus-within { border-color: #ff6b00; box-shadow: 0 0 0 3px rgba(255,107,0,0.15); }
        .input-group input {
            background: transparent; border: none; color: #fff; font-size: 18px;
            padding: 10px 0; width: 200px; outline: none; letter-spacing: 2px;
            font-weight: 500;
        }
        .input-group button {
            padding: 10px 28px; border: none; border-radius: 10px;
            background: #ff6b00; color: #fff; font-size: 16px; font-weight: 600;
            cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 12px rgba(255,107,0,0.3);
        }
        .input-group button:hover { background: #e05e00; transform: translateY(-1px); }
        .input-group button:active { transform: scale(0.96); }
        #error-msg { color: #ff4d4d; font-size: 14px; margin-top: 16px; display: none; font-weight: 500; }

        #ui-container {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 1200px;
            pointer-events: none;
        }

        #control-panel {
            pointer-events: auto;
            background: rgba(18, 18, 18, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.7);
            padding: 8px 16px;
            border-radius: 24px;
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        #control-panel.hidden {
            opacity: 0;
            transform: translateY(24px) scale(0.96);
            pointer-events: none;
            visibility: hidden;
        }

        .fab-btn {
            pointer-events: auto;
            width: 32px; height: 32px; border-radius: 50%; border: none;
            background: rgba(18, 18, 18, 0.7); backdrop-filter: blur(12px);
            color: #fff; font-size: 18px; cursor: pointer;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .fab-btn:hover { background: rgba(255,255,255,0.1); transform: scale(1.05); }
        .fab-btn:active { transform: scale(0.9); }

        .group-slider {
            display: flex; align-items: center; gap: 12px; flex: 1.4; min-width: 180px;
        }
        .info-row {
            color: #fff; font-size: 13px; font-weight: 500; white-space: nowrap;
            display: flex; align-items: center; gap: 6px;
        }
        .row-counter {
            background: #ff6b00; padding: 1px 8px; border-radius: 20px; font-size: 11px; color: #fff; font-weight: 600;
        }
        .slider-wrapper { flex: 1; display: flex; align-items: center; height: 20px; position: relative; }
        input[type=range] {
            -webkit-appearance: none; appearance: none; width: 100%; height: 3px;
            background: rgba(255,255,255,0.12); border-radius: 4px; outline: none;
            transition: background 0.2s;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%;
            background: #ff6b00; cursor: pointer; border: 2px solid #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5); transition: transform 0.15s;
        }
        input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.15); }
        input[type=range]::-moz-range-thumb {
            width: 16px; height: 16px; border-radius: 50%;
            background: #ff6b00; cursor: pointer; border: 2px solid #fff;
        }
        .slider-val {
            position: absolute; top: -28px; left: 50%; transform: translateX(-50%);
            background: #1e1e1e; padding: 2px 10px; border-radius: 8px;
            font-size: 11px; font-weight: 600; color: #fff; opacity: 0;
            transition: opacity 0.2s; pointer-events: none; border: 1px solid rgba(255,255,255,0.05);
        }
        .slider-wrapper:hover .slider-val { opacity: 1; }

        .group-controls {
            display: flex; align-items: center; gap: 6px; flex: 0 0 auto;
        }
        .btn {
            width: 36px; height: 36px; padding: 0; border: none; border-radius: 10px;
            background: rgba(255, 255, 255, 0.06); color: #fff; font-size: 16px;
            cursor: pointer; display: flex; justify-content: center; align-items: center;
            transition: all 0.15s; border: 1px solid rgba(255,255,255,0.04);
            position: relative;
        }
        .btn:hover { background: rgba(255, 255, 255, 0.12); transform: translateY(-1px); }
        .btn:active { transform: scale(0.92); }
        .btn-home { background: rgba(255, 255, 255, 0.08); }
        .btn::after {
            content: attr(data-tip);
            position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%) scale(0.9);
            background: #1a1a1a; color: #fff; padding: 4px 12px; border-radius: 6px;
            font-size: 11px; font-weight: 500; white-space: nowrap; opacity: 0;
            pointer-events: none; transition: all 0.15s; border: 1px solid rgba(255,255,255,0.06);
        }
        .btn:hover::after { opacity: 1; transform: translateX(-50%) scale(1); }

        .group-right {
            display: flex; align-items: center; gap: 5px; flex: 1; justify-content: flex-end; flex-wrap: wrap;
        }
        .btn-toggle, .btn-action {
            width: 34px; height: 34px; padding: 0; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.04); color: #aaa; font-size: 15px;
            cursor: pointer; display: flex; justify-content: center; align-items: center;
            transition: all 0.15s; position: relative;
        }
        .btn-toggle:hover, .btn-action:hover { border-color: rgba(255,255,255,0.15); color: #fff; }
        .btn-toggle.active {
            background: #28a745; color: #fff; border-color: #28a745;
            box-shadow: 0 0 20px rgba(40, 167, 69, 0.25);
        }
        .btn-toggle::after, .btn-action::after {
            content: attr(data-tip);
            position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%) scale(0.9);
            background: #1a1a1a; color: #fff; padding: 4px 12px; border-radius: 6px;
            font-size: 11px; font-weight: 500; white-space: nowrap; opacity: 0;
            pointer-events: none; transition: all 0.15s; border: 1px solid rgba(255,255,255,0.06);
        }
        .btn-toggle:hover::after, .btn-action:hover::after { opacity: 1; transform: translateX(-50%) scale(1); }
        .btn-action:active { transform: scale(0.9); }
        .btn-spec { background: #ff6b00; color: #fff; }
        .btn-spec:hover { background: #e05e00; }

        #modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); z-index: 100;
            display: none; justify-content: center; align-items: center;
        }
        #modal-overlay.open { display: flex; }
        
        #modal-content {
            background: #151515; border: 1px solid rgba(255,255,255,0.06);
            border-radius: 20px; width: 90%; max-width: 700px; max-height: 85vh;
            padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            overflow-y: auto; color: #fff; position: relative;
            animation: modalFadeIn 0.25s ease;
        }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(20px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        #modal-content h2 { margin: 0 0 12px 0; font-size: 20px; border-bottom: 2px solid #ff6b00; padding-bottom: 10px; display: flex; align-items: center; gap: 10px; }
        #modal-close {
            position: absolute; top: 16px; right: 20px; font-size: 26px; cursor: pointer;
            color: #888; transition: color 0.2s;
        }
        #modal-close:hover { color: #fff; }

        .spec-group { margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .spec-group h3 { color: #28a745; margin: 0 0 8px 0; font-size: 15px; font-weight: 600; }
        .spec-line { display: flex; justify-content: space-between; padding: 4px 0; font-size: 14px; color: #ccc; }
        .spec-line span:last-child { color: #fff; font-weight: 500; }
        .grand-total { margin-top: 16px; padding-top: 12px; border-top: 2px dashed rgba(255,255,255,0.1); text-align: right; font-size: 16px; font-weight: 600; color: #ff6b00; }
        .grand-total span { color: #fff; font-weight: 400; }

        @media (max-width: 820px) {
            #control-panel { flex-wrap: wrap; padding: 8px 12px; border-radius: 18px; max-width: 96%; gap: 8px; }
            .group-slider { flex: 1; min-width: 120px; gap: 8px; }
            .group-right { flex: 1; justify-content: flex-start; gap: 4px; }
            .group-controls { gap: 4px; }
            .btn, .btn-toggle, .btn-action { width: 32px; height: 32px; font-size: 14px; }
            .btn::after, .btn-toggle::after, .btn-action::after { display: none; }
            .slider-val { display: none; }
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="branding">
        <img id="project-logo" src="" alt="logo" onerror="this.style.display='none'">
        <span id="project-title">Проект</span>
    </div>

    <div id="access-screen">
        <h1>🔒 Доступ к проекту</h1>
        <p>Введите номер заказа или код проекта</p>
        <div class="input-group">
            <input type="text" id="access-code" placeholder="Введите код" maxlength="20" autofocus>
            <button id="btn-unlock">Открыть</button>
        </div>
        <div id="error-msg">Ключ недействителен или заказ не найден.</div>
    </div>

    <div id="ui-container">
        <button class="fab-btn" id="toggle-ui">⌃</button>
        <div id="control-panel">
            
            <div class="group-slider">
                <div class="info-row">
                    <span style="opacity:0.5; font-weight:300;">⇪</span> Ряд <span id="current-row-txt">54</span><span class="row-counter">/54</span>
                </div>
                <div class="slider-wrapper">
                    <span class="slider-val" id="slider-val">54</span>
                    <input type="range" id="row-slider" min="1" max="54" value="54">
                </div>
            </div>

            <div class="group-controls">
                <button class="btn" id="btn-minus" data-tip="Убавить ряд">−</button>
                <button class="btn" id="btn-plus" data-tip="Добавить ряд">+</button>
                <button class="btn btn-home" id="btn-reset" data-tip="Сброс камеры">⌖</button>
            </div>

            <div class="group-right">
                <button class="btn-toggle active" data-layer="palette_brick_facade" data-tip="Лицевой кирпич">▦</button>
                <button class="btn-toggle active" data-layer="palette_brick_building" data-tip="Забутовка">⊞</button>
                <button class="btn-toggle active" data-layer="palette_brick_refractory" data-tip="Шамот">⟐</button>
                <button class="btn-toggle active" data-layer="palette_iron" data-tip="Литье и металл">⚙</button>
                
                <button class="btn-action" id="btn-screenshot" data-tip="Скриншот">⊡</button>
                <button class="btn-action" id="btn-tech" data-tip="Характеристики">≡</button>
                <button class="btn-spec btn-action" id="btn-spec" data-tip="Спецификация">📋</button>
            </div>
        </div>
    </div>

    <div id="modal-overlay">
        <div id="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; padding-right: 0;">
                <!-- Кнопка закрытия -->
                <span id="modal-close" style="position: static; font-size: 26px; cursor: pointer; color: #888; transition: color 0.2s;">&times;</span>
                
                <!-- Кнопка "Поделиться" с умной ссылкой -->
                <button id="btn-share-modal" style="background: none; border: none; color: #888; font-size: 20px; cursor: pointer; transition: color 0.2s; padding: 0; margin-right: 5px;" title="Поделиться проектом">🔗</button>
            </div>

            <h2 style="margin-top: 5px;">
                <span id="modal-title-text">Спецификация материалов</span>
                <span style="font-weight:400; color:#888; margin-left:5px;">—</span>
                <span id="modal-project-title" style="font-weight:400; color:#ff6b00;">Проект</span>
            </h2>
            <div id="spec-list"></div>
            <div id="pdf-actions" style="margin-top:20px; border-top:1px solid rgba(255,255,255,0.06); padding-top:16px; display:flex; justify-content:center;">
                <button id="btn-download-pdf" style="background:#ff6b00; color:#fff; border:none; padding:8px 24px; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; transition:background 0.2s;">📄 Скачать PDF</button>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

        const hdrPath = 'park.hdr'; 
        let scene, camera, renderer, controls, model;
        let maxRows = 54; 
        let currentRenderedRow = 54;
        const activePalettes = {
            palette_brick_facade: true,
            palette_brick_building: true,
            palette_brick_refractory: true,
            palette_iron: true
        };

        let currentSpecData = null;
        let currentTechPath = null;

        // ===== УМНАЯ ЗАГРУЗКА ИЗ URL =====
        function checkUrlForCode() {
            const hash = window.location.hash;
            if (hash && hash.startsWith('#') && hash.length > 1) {
                const codeFromUrl = hash.substring(1).trim();
                if (codeFromUrl) {
                    document.getElementById('access-code').value = codeFromUrl;
                    handleAccessCode();
                }
            }
        }

        function updateVisibilityMatrix() {
            if (!model) return;
            document.getElementById('current-row-txt').innerText = currentRenderedRow;
            document.getElementById('slider-val').innerText = currentRenderedRow;
            model.traverse(function (node) {
                if (!node.name) return;
                let nodeName = node.name.trim().toLowerCase();
                let matchRow = nodeName.match(/row_[_-]?0*(\d+)/);
                if (matchRow) {
                    let rowNumber = parseInt(matchRow[1]);
                    node.visible = (rowNumber <= currentRenderedRow);
                }
                if (nodeName.includes('palette_brick_facade')) {
                    node.visible = activePalettes['palette_brick_facade'];
                    return;
                } else if (nodeName.includes('palette_brick_building')) {
                    node.visible = activePalettes['palette_brick_building'];
                    return;
                } else if (nodeName.includes('palette_brick_refractory')) {
                    node.visible = activePalettes['palette_brick_refractory'];
                    return;
                } else if (nodeName.includes('palette_iron')) {
                    node.visible = activePalettes['palette_iron'];
                    return;
                }
                let matName = '';
                if (node.isMesh && node.material) {
                    if (Array.isArray(node.material)) {
                        matName = node.material.map(m => (m.name ? m.name.trim().toLowerCase() : '')).join(' ');
                    } else {
                        matName = node.material.name ? node.material.name.trim().toLowerCase() : '';
                    }
                }
                let parentName = node.parent && node.parent.name ? node.parent.name.trim().toLowerCase() : '';
                let searchString = nodeName + ' ' + matName + ' ' + parentName;
                let target = null;
                if (searchString.includes('солома') || searchString.includes('темный') || searchString.includes('lf-')) {
                    target = activePalettes['palette_brick_facade'];
                } else if (searchString.includes('кирпич 1нф строительный') || searchString.includes('sp-')) {
                    target = activePalettes['palette_brick_building'];
                } else if (searchString.includes('[color_003]') || searchString.includes('[color_007]2') || searchString.includes('sh8-')) {
                    target = activePalettes['palette_brick_refractory'];
                } else if (
                    searchString.includes('metal_06_1k1') || searchString.includes('*2') ||
                    searchString.includes('дверка') || searchString.includes('дверца') || searchString.includes('колосник') ||
                    searchString.includes('труба') || searchString.includes('шибер') || searchString.includes('уголок') ||
                    searchString.includes('плита') || searchString.includes('гайка') || searchString.includes('шайба') ||
                    searchString.includes('шпилька') || searchString.includes('подвес') || searchString.includes('тоннель')
                ) {
                    target = activePalettes['palette_iron'];
                }
                if (target !== null) {
                    node.visible = target;
                }
            });
        }

        function renderSpecification() {
            const container = document.getElementById('spec-list');
            container.innerHTML = '';

            if (!currentSpecData) {
                container.innerHTML = `<div style="text-align:center; color:#888; padding:20px;">Спецификация не загружена.</div>`;
                return;
            }

            let lightWhole = 0, lightHalf = 0;
            if (currentSpecData["Лицевой светлый"]) {
                for (const [itemName, itemData] of Object.entries(currentSpecData["Лицевой светлый"])) {
                    const qty = itemData.qty, length = itemData.length;
                    if (length > 120) lightWhole += qty; else lightHalf += qty;
                }
            }
            let darkWhole = 0, darkHalf = 0;
            if (currentSpecData["Лицевой тёмный"]) {
                for (const [itemName, itemData] of Object.entries(currentSpecData["Лицевой тёмный"])) {
                    const qty = itemData.qty, length = itemData.length;
                    if (length > 120) darkWhole += qty; else darkHalf += qty;
                }
            }
            let buildingWhole = 0, buildingHalf = 0;
            if (currentSpecData["Забутовка"]) {
                for (const [itemName, itemData] of Object.entries(currentSpecData["Забутовка"])) {
                    const qty = itemData.qty, length = itemData.length;
                    if (length > 120) buildingWhole += qty; else buildingHalf += qty;
                }
            }
            let refWhole = 0, refHalf = 0;
            if (currentSpecData["Шамот"]) {
                for (const [itemName, itemData] of Object.entries(currentSpecData["Шамот"])) {
                    const qty = itemData.qty, length = itemData.length;
                    if (length > 124) refWhole += qty; else refHalf += qty;
                }
            }
            
            const totalLight = Math.ceil(lightWhole + (lightHalf / 2));
            const totalDark = Math.ceil(darkWhole + (darkHalf / 2));
            const totalBuilding = Math.ceil(buildingWhole + (buildingHalf / 2));
            const totalRef = Math.ceil(refWhole + (refHalf / 2));
            
            const totalRedBricks = totalLight + totalDark + totalBuilding;
            const clayMortar = Math.round(totalRedBricks * 1.1);
            const refractoryMortar = Math.round(totalRef * 0.6);
            
            let metalHtml = '';
            let metalTotal = 0;
            
            if (currentSpecData["Литье / Металл"]) {
                const metalGroups = {
                    "Метизы и крепеж": [],
                    "Печное литье и фурнитура": [],
                    "Дымоходы, изоляция и тоннели": [],
                    "Металлоконструкции (профили, уголки)": [],
                    "Прочее": []
                };

                for (const [itemName, itemData] of Object.entries(currentSpecData["Литье / Металл"])) {
                    metalTotal += itemData.qty;
                    const lowerName = itemName.toLowerCase();

                    if (lowerName.includes('гайка') || lowerName.includes('шайба') || lowerName.includes('шпилька') || lowerName.includes('болт')) {
                        metalGroups["Метизы и крепеж"].push({name: itemName, qty: itemData.qty});
                    } 
                    else if (lowerName.includes('дверц') || lowerName.includes('колосник') || lowerName.includes('плита') || lowerName.includes('мойка') || lowerName.includes('шибер') || lowerName.includes('подсветка')) {
                        metalGroups["Печное литье и фурнитура"].push({name: itemName, qty: itemData.qty});
                    }
                    else if (lowerName.includes('труб') || lowerName.includes('отвод') || lowerName.includes('базальт') || lowerName.includes('картон') || lowerName.includes('тоннель') || lowerName.includes('шнур')) {
                        metalGroups["Дымоходы, изоляция и тоннели"].push({name: itemName, qty: itemData.qty});
                    }
                    else if (lowerName.includes('уголок') || lowerName.includes('подвес') || lowerName.includes('профиль')) {
                        metalGroups["Металлоконструкции (профили, уголки)"].push({name: itemName, qty: itemData.qty});
                    } else {
                        metalGroups["Прочее"].push({name: itemName, qty: itemData.qty});
                    }
                }

                for (const [groupName, items] of Object.entries(metalGroups)) {
                    if (items.length > 0) {
                        let groupHtml = `<div class="spec-group"><h3>${groupName}</h3>`;
                        for (const item of items) {
                            groupHtml += `<div class="spec-line"><span>${item.name}</span><span>${item.qty} шт.</span></div>`;
                        }
                        groupHtml += `</div>`;
                        metalHtml += groupHtml;
                    }
                }
            }

            const totalBricksOnly = totalLight + totalDark + totalBuilding + totalRef;
            
            container.innerHTML = `
                <div class="spec-group"><h3>Лицевой светлый (250×120×65)</h3><div class="spec-line"><span>Итого:</span><span>${totalLight} шт.</span></div></div>
                <div class="spec-group"><h3>Лицевой тёмный (250×120×65)</h3><div class="spec-line"><span>Итого:</span><span>${totalDark} шт.</span></div></div>
                <div class="spec-group"><h3>Строительный М150 (250×120×65)</h3><div class="spec-line"><span>Итого:</span><span>${totalBuilding} шт.</span></div></div>
                <div class="spec-group"><h3>Шамот ШБ-8 (250×124×65)</h3><div class="spec-line"><span>Итого:</span><span>${totalRef} шт.</span></div></div>
                <div class="spec-group"><h3>Растворы</h3>
                    <div class="spec-line"><span>Цементно-песчаная М150:</span><span>${clayMortar} кг</span></div>
                    <div class="spec-line"><span>Огнеупорный мертель:</span><span>${refractoryMortar} кг</span></div>
                </div>
                ${metalHtml}
                <div class="grand-total">Всего кирпича: <span>${totalBricksOnly} шт.</span></div>
            `;
        }

        function loadTechnicalNotes() {
            const container = document.getElementById('spec-list');
            const titleText = document.getElementById('modal-title-text');

            if (!currentTechPath) {
                container.innerHTML = `<div style="text-align:center; color:#888; padding:30px;">Характеристики не загружены.</div>`;
                if (titleText) titleText.innerText = 'Характеристики';
                document.getElementById('modal-overlay').classList.add('open');
                return;
            }

            fetch(currentTechPath + '?t=' + Date.now())
                .then(response => {
                    if (!response.ok) throw new Error('Файл не найден');
                    return response.text();
                })
                .then(htmlContent => {
                    if (titleText) titleText.innerText = 'Характеристики';
                    container.innerHTML = htmlContent;
                    document.getElementById('modal-overlay').classList.add('open');
                })
                .catch(() => {
                    container.innerHTML = `<div style="text-align:center; color:#ff4d4d; padding:20px;">Ошибка загрузки данных.</div>`;
                    document.getElementById('modal-overlay').classList.add('open');
                });
        }

        function loadModel(blobUrl) {
            scene = new THREE.Scene(); scene.background = null; scene.environment = null;
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
            resetCameraPosition();
            renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.body.appendChild(renderer.domElement);
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; controls.dampingFactor = 0.08;

            const rgbeloader = new RGBELoader();
            rgbeloader.load('park.hdr', function (texture) {
                texture.mapping = THREE.EquirectangularReflectionMapping;
                scene.environment = texture; scene.background = texture;
            }, undefined, function () { scene.background = new THREE.Color(0x1a1a1a); });

            const gltfLoader = new GLTFLoader();
            gltfLoader.load(blobUrl, function (gltf) {
                model = gltf.scene;
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                model.position.sub(center); model.position.y = 0; model.scale.set(1.3, 1.3, 1.3);
                scene.add(model);
                document.getElementById('access-screen').classList.add('hidden');
                initInterfaceListeners();
                updateVisibilityMatrix();
            }, undefined, function (err) {
                console.error('Ошибка загрузки модели:', err);
                document.getElementById('error-msg').innerText = 'Ошибка загрузки модели. Проверьте файл.';
                document.getElementById('error-msg').style.display = 'block';
                document.getElementById('btn-unlock').innerText = 'Открыть';
            });
            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        function handleAccessCode() {
            const code = document.getElementById('access-code').value.trim();
            const errorMsg = document.getElementById('error-msg');
            if (!code) { errorMsg.style.display = 'block'; return; }
            
            errorMsg.style.display = 'none';
            document.getElementById('btn-unlock').innerText = 'Проверка...';
            
            // Генерируем уникальный Device ID
            let deviceId = localStorage.getItem('pechnik_device_id');
            if (!deviceId) {
                deviceId = 'dev_' + Date.now() + '_' + Math.random().toString(36).substring(2, 10);
                localStorage.setItem('pechnik_device_id', deviceId);
            }
            
            fetch('wc_auth.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'code=' + encodeURIComponent(code) + '&device_id=' + encodeURIComponent(deviceId)
            })
            .then(response => {
                if (!response.ok) throw new Error('Ошибка доступа');
                const rawTitle = response.headers.get('X-Project-Title');
                const rawLogo = response.headers.get('X-Project-Logo');
                const rawSpec = response.headers.get('X-Project-Spec');
                const rawTech = response.headers.get('X-Project-Tech');
                
                const title = rawTitle ? decodeURIComponent(rawTitle) : 'Проект печи';
                const logo = rawLogo ? decodeURIComponent(rawLogo) : '';
                const specPath = rawSpec ? decodeURIComponent(rawSpec) : null;
                const techPath = rawTech ? decodeURIComponent(rawTech) : null;

                document.getElementById('project-title').innerText = title;
                const logoImg = document.getElementById('project-logo');
                if (logo) {
                    logoImg.src = logo;
                    logoImg.style.display = 'block';
                } else {
                    logoImg.style.display = 'none';
                }
                document.getElementById('branding').classList.add('active');

                currentTechPath = techPath;

                if (specPath) {
                    return fetch(specPath + '?t=' + Date.now()).then(res => res.json()).then(specJson => {
                        currentSpecData = specJson;
                        return response.blob();
                    });
                } else {
                    currentSpecData = null;
                    return response.blob();
                }
            })
            .then(blob => {
                const url = URL.createObjectURL(blob);
                loadModel(url);
                document.getElementById('btn-unlock').innerText = 'Открыть';
            })
            .catch(error => {
                document.getElementById('btn-unlock').innerText = 'Открыть';
                errorMsg.style.display = 'block';
                console.error(error);
            });
        }

        function resetCameraPosition() { camera.position.set(0, 2, 5); if (controls) controls.target.set(0, 1, 0); }

        function downloadModalContentAsPDF() {
            const btn = document.getElementById('btn-download-pdf');
            const originalText = btn.innerText;
            btn.innerText = '⏳ Генерация...';
            btn.disabled = true;

            const container = document.getElementById('spec-list');
            const projectTitle = document.getElementById('project-title').innerText || 'Проект';
            const modalTitle = document.getElementById('modal-title-text').innerText || 'Документация';
            
            const contentClone = container.cloneNode(true);
            contentClone.style.fontSize = '18px';
            contentClone.style.lineHeight = '1.7';
            
            const headerHtml = `
                <div style="background:#1e1e1e; color:#ff6b00; padding:15px 20px; border-bottom:3px solid #ff6b00; display:flex; align-items:center; gap:15px; font-family:Arial,sans-serif;">
                    <div style="font-size:13px; font-weight:bold;">Печных дел Мастер</div>
                    <div style="flex:1;"></div>
                    <div style="font-size:16px; font-weight:bold; color:#fff;">${projectTitle}</div>
                </div>
                <div style="padding:0 20px 10px 20px; background:#1e1e1e; border-bottom:1px solid #444;">
                    <div style="color:#888; font-size:13px;">${modalTitle} — ${new Date().toLocaleDateString('ru-RU')}</div>
                </div>
            `;

            const fullHtml = `
                <div style="background:#1e1e1e; color:#ccc; font-family:Arial,sans-serif; padding-bottom:30px; width:100%;">
                    ${headerHtml}
                    <div style="padding:20px;">
                        ${contentClone.innerHTML}
                    </div>
                    <div style="padding:10px 20px; border-top:1px solid #333; color:#666; font-size:11px; text-align:center;">
                        Проект студии <b style="color:#ff6b00;">Печных дел Мастер</b> | pechnik-novosib.ru
                    </div>
                </div>
            `;

            const tempDiv = document.createElement('div');
            tempDiv.style.position = 'absolute';
            tempDiv.style.left = '-9999px';
            tempDiv.style.top = '0';
            tempDiv.innerHTML = fullHtml;
            document.body.appendChild(tempDiv);

            html2canvas(tempDiv, {
                scale: 2,
                backgroundColor: '#1e1e1e',
                useCORS: true,
                allowTaint: true
            }).then(canvas => {
                const imgData = canvas.toDataURL('image/png');
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'a4');
                const imgWidth = 210;
                const pageHeight = 297;
                const imgHeight = (canvas.height * imgWidth) / canvas.width;
                let heightLeft = imgHeight;
                let position = 0;
                pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
                heightLeft -= pageHeight;
                while (heightLeft > 0) {
                    position = heightLeft - imgHeight;
                    pdf.addPage();
                    pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
                    heightLeft -= pageHeight;
                }
                const safeTitle = projectTitle.replace(/[^a-zA-Zа-яА-Я0-9\s]/g, '').replace(/\s+/g, '_');
                const safeModalTitle = modalTitle.replace(/\s+/g, '_');
                pdf.save(`${safeTitle}_${safeModalTitle}.pdf`);
                document.body.removeChild(tempDiv);
                btn.innerText = originalText;
                btn.disabled = false;
                btn.style.background = '#28a745';
                setTimeout(() => { btn.style.background = '#ff6b00'; }, 1500);
            }).catch(err => {
                console.error('Ошибка генерации PDF:', err);
                btn.innerText = originalText;
                btn.disabled = false;
                alert('Не удалось сгенерировать PDF.');
            });
        }

        function initInterfaceListeners() {
            document.getElementById('btn-plus').addEventListener('click', () => { 
                if (currentRenderedRow < maxRows) { 
                    currentRenderedRow++; 
                    updateVisibilityMatrix(); 
                    document.getElementById('row-slider').value = currentRenderedRow; 
                } 
            });
            document.getElementById('btn-minus').addEventListener('click', () => { 
                if (currentRenderedRow > 1) { 
                    currentRenderedRow--; 
                    updateVisibilityMatrix(); 
                    document.getElementById('row-slider').value = currentRenderedRow; 
                } 
            });
            document.getElementById('btn-reset').addEventListener('click', resetCameraPosition);
            document.getElementById('btn-screenshot').addEventListener('click', function() {
                if (!model || !renderer) return;
                const canvas = renderer.domElement;
                const dataURL = canvas.toDataURL('image/png');
                const projectTitle = document.getElementById('project-title').innerText || 'Проект';
                const currentRow = document.getElementById('current-row-txt').innerText || '0';
                const safeTitle = projectTitle.replace(/[^a-zA-Zа-яА-Я0-9\s]/g, '').replace(/\s+/g, '_');
                const fileName = `Проект_${safeTitle}_Ряд_${currentRow}.png`;
                const link = document.createElement('a');
                link.href = dataURL;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });
            document.getElementById('btn-tech').addEventListener('click', loadTechnicalNotes);
            document.getElementById('btn-spec').addEventListener('click', function() {
                const titleText = document.getElementById('modal-title-text');
                if (titleText) titleText.innerText = 'Спецификация материалов';
                renderSpecification();
                document.getElementById('modal-overlay').classList.add('open');
            });            
            document.getElementById('modal-close').addEventListener('click', () => { document.getElementById('modal-overlay').classList.remove('open'); });
            document.getElementById('modal-overlay').addEventListener('click', (e) => { if (e.target === e.currentTarget) { document.getElementById('modal-overlay').classList.remove('open'); } });
            document.getElementById('row-slider').addEventListener('input', function() { 
                const newRow = parseInt(this.value); 
                if (newRow !== currentRenderedRow) { 
                    currentRenderedRow = newRow; 
                    updateVisibilityMatrix(); 
                } 
            });
            document.querySelectorAll('.btn-toggle').forEach(button => { button.addEventListener('click', function() { 
                const layerName = this.getAttribute('data-layer'); 
                this.classList.toggle('active'); 
                activePalettes[layerName] = this.classList.contains('active'); 
                updateVisibilityMatrix(); 
            }); });
            document.getElementById('toggle-ui').addEventListener('click', function() { document.getElementById('control-panel').classList.toggle('hidden'); });
            document.getElementById('btn-download-pdf').addEventListener('click', downloadModalContentAsPDF);

            // ===== ОБРАБОТЧИК КНОПКИ "ПОДЕЛИТЬСЯ" =====
            document.getElementById('btn-share-modal').addEventListener('click', function() {
                const code = document.getElementById('access-code').value.trim();
                if (!code) {
                    alert('Сначала откройте проект по коду доступа.');
                    return;
                }
                const baseUrl = window.location.href.split('#')[0];
                // Добавляем ?bot=1 для корректного превью
                const shareUrl = baseUrl + '#' + code;
                
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(shareUrl).then(() => {
                        const btn = this;
                        btn.innerText = '✅';
                        btn.style.color = '#28a745';
                        setTimeout(() => {
                            btn.innerText = '🔗';
                            btn.style.color = '#888';
                        }, 2000);
                    });
                } else {
                    const textarea = document.createElement('textarea');
                    textarea.value = shareUrl;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    const btn = this;
                    btn.innerText = '✅';
                    btn.style.color = '#28a745';
                    setTimeout(() => {
                        btn.innerText = '🔗';
                        btn.style.color = '#888';
                    }, 2000);
                }
            });
        }

        function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
        function onWindowResize() { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }

        document.getElementById('btn-unlock').addEventListener('click', handleAccessCode);
        document.getElementById('access-code').addEventListener('keydown', (e) => { if (e.key === 'Enter') handleAccessCode(); });

        // ===== ЗАПУСК ПРОВЕРКИ URL ПРИ ЗАГРУЗКЕ СТРАНИЦЫ =====
        window.addEventListener('load', checkUrlForCode);
    </script>
</body>
</html>
