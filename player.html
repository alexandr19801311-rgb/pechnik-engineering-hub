<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>3D Player — Печь с порядовкой</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* Удобная панель управления под грязные руки */
        #control-panel {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            z-index: 10; width: 90%; max-width: 500px; background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1);
            padding: 20px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; gap: 15px; box-sizing: border-box;
        }
        
        .info-row { display: flex; justify-content: space-between; align-items: center; color: #fff; font-size: 18px; font-weight: bold; }
        .row-counter { background: #ff6b00; padding: 4px 12px; border-radius: 20px; font-size: 16px; }
        
        .buttons-row { display: flex; gap: 10px; width: 100%; }
        .btn {
            flex: 1; height: 60px; border: none; background: #2a2a2a; color: #fff;
            font-size: 18px; font-weight: bold; border-radius: 12px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: background 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .btn:active { background: #444; }
        .btn-main { background: #ff6b00; }
        .btn-main:active { background: #e05e00; }
        
        .palettes-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .btn-toggle {
            padding: 8px 14px; font-size: 13px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05); color: #ccc; cursor: pointer; font-weight: 500;
        }
        .btn-toggle.active { background: #28a745; color: #fff; border-color: #28a745; }
    </style>
    
    <!-- Твоя оригинальная рабочая карта импортов версии 0.160.0 -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="control-panel">
        <div class="info-row">
            <span>Порядовка комплекса</span>
            <span class="row-counter">Ряд: <span id="current-row-txt">54</span>/54</span>
        </div>
        
        <div class="buttons-row">
            <button class="btn" id="btn-prev">◀ НАЗАД</button>
            <button class="btn" id="btn-reset" title="Сбросить камеру">🏠</button>
            <button class="btn btn-main" id="btn-next">ВПЕРЕД ▶</button>
        </div>

        <div class="palettes-row">
            <button class="btn-toggle active" data-layer="palette_brick_facade">Лицевой</button>
            <button class="btn-toggle active" data-layer="palette_brick_building">Забутовка</button>
            <button class="btn-toggle active" data-layer="palette_brick_refractory">Шамот</button>
            <button class="btn-toggle active" data-layer="palette_iron">Литье</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

        // --- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ---
        const hdrPath = 'park.hdr';          
        const modelPath = 'model/pech.glb'; 
        
        let scene, camera, renderer, controls, model;
        
        // Переменные логики порядовки
        let maxRows = 54; 
        let currentRenderedRow = 54;

        // Карта активности палитр материалов
        const activePalettes = {
            palette_brick_facade: true,
            palette_brick_building: true,
            palette_brick_refractory: true,
            palette_iron: true
        };
        function init() {
            // 1. Сцена (как в твоем оригинале)
            scene = new THREE.Scene();
            scene.background = null;
            scene.environment = null;

            // 2. Камера (как в твоем оригинале)
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
            resetCameraPosition();

            // 3. Рендерер (как в твоем оригинале)
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            document.body.appendChild(renderer.domElement);

            // 4. Орбитальное управление (как в твоем оригинале)
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // 5. Загрузка HDRI (как в твоем оригинале)
            const rgbeloader = new RGBELoader();
            rgbeloader.load(hdrPath, function (texture) {
                texture.mapping = THREE.EquirectangularReflectionMapping;
                scene.environment = texture;
                scene.background = texture;
            }, undefined, function (err) {
                console.error('Ошибка загрузки HDRI:', err);
                scene.background = new THREE.Color(0x222222);
            });

            // 6. Загрузка модели с добавлением обработчиков кнопок
            const gltfLoader = new GLTFLoader();
            gltfLoader.load(modelPath, function (gltf) {
                model = gltf.scene;

                // Авто-центрирование, Y=0 и масштаб (как в твоем оригинале)
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                model.position.sub(center);
                model.position.y = 0; 
                model.scale.set(1.3, 1.3, 1.3);

                scene.add(model);
                
                // Включаем наши кнопки и палитры после успешной загрузки печи
                initInterfaceListeners();
                updateVisibilityMatrix(); 
            }, undefined, function (err) {
                console.error('Ошибка загрузки модели:', err);
            });

            // 7. Обработка ресайза окна (как в твоем оригинале)
            window.addEventListener('resize', onWindowResize, false);
        }

        function resetCameraPosition() {
            camera.position.set(0, 2, 5);
            if (controls) controls.target.set(0, 1, 0);
        }

        // Функция фильтрации: сверяет row_ и palette_
function updateVisibilityMatrix() {
    if (!model) return;
    document.getElementById('current-row-txt').innerText = currentRenderedRow;

    model.traverse(function (node) {
        let nodeName = node.name ? node.name.trim().toLowerCase() : '';

        // 1. Управление рядами (проверяем имя узла)
        let matchRow = nodeName.match(/row_[_-]?0*(\d+)/);
        if (matchRow) {
            let rowNumber = parseInt(matchRow[1]);
            node.visible = (rowNumber <= currentRenderedRow);
        }

        // 2. Управление группами палитр (если узел имеет имя палитры, выходим)
        if (nodeName.includes('palette_brick_facade')) {
            node.visible = activePalettes['palette_brick_facade'];
            return;
        } else if (nodeName.includes('palette_brick_building')) {
            node.visible = activePalettes['palette_brick_building'];
            return;
        } else if (nodeName.includes('palette_brick_refractory')) {
            node.visible = activePalettes['palette_brick_refractory'];
            return;
        } else if (nodeName.includes('palette_iron')) {
            node.visible = activePalettes['palette_iron'];
            return;
        }

        // 3. Берем имя Материала (если это меш) и имя Родителя
        let matName = '';
        if (node.isMesh && node.material) {
            if (Array.isArray(node.material)) {
                matName = node.material.map(m => (m.name ? m.name.trim().toLowerCase() : '')).join(' ');
            } else {
                matName = node.material.name ? node.material.name.trim().toLowerCase() : '';
            }
        }

        let parentName = node.parent && node.parent.name ? node.parent.name.trim().toLowerCase() : '';
        
        // Объединяем всё в одну строку для поиска
        let searchString = nodeName + ' ' + matName + ' ' + parentName;

        // 4. Идеальное сопоставление по вашим данным из консоли
        // Лицевой (ищем "солома", "темный" или "lf-")
        if (searchString.includes('солома') || searchString.includes('темный') || searchString.includes('lf-')) {
            node.visible = activePalettes['palette_brick_facade'];
        }
        // Забутовка (ищем "кирпич 1нф строительный" или "sp-")
        else if (searchString.includes('кирпич 1нф строительный') || searchString.includes('sp-')) {
            node.visible = activePalettes['palette_brick_building'];
        }
        // Шамот (ищем "[color_003]" или "[color_007]2" или "sh8-")
        else if (searchString.includes('[color_003]') || searchString.includes('[color_007]2') || searchString.includes('sh8-')) {
            node.visible = activePalettes['palette_brick_refractory'];
        }
        // Литье / Металл (ищем материалы и русские названия деталей)
        else if (
            searchString.includes('metal_06_1k1') || searchString.includes('*2') ||
            searchString.includes('дверка') || searchString.includes('дверца') ||
            searchString.includes('колосник') || searchString.includes('труба') ||
            searchString.includes('шибер') || searchString.includes('уголок') ||
            searchString.includes('плита') || searchString.includes('гайка') ||
            searchString.includes('шайба') || searchString.includes('шпилька') ||
            searchString.includes('подвес') || searchString.includes('тоннель')
        ) {
            node.visible = activePalettes['palette_iron'];
        }
    });
}

        function initInterfaceListeners() {
            // Кнопка Вперед
            document.getElementById('btn-next').addEventListener('click', () => {
                if (currentRenderedRow < maxRows) {
                    currentRenderedRow++;
                    updateVisibilityMatrix();
                }
            });

            // Кнопка Назад
            document.getElementById('btn-prev').addEventListener('click', () => {
                if (currentRenderedRow > 1) {
                    currentRenderedRow--;
                    updateVisibilityMatrix();
                }
            });

            // Кнопка Сброс камеры
            document.getElementById('btn-reset').addEventListener('click', () => {
                resetCameraPosition();
            });

            // Кнопки тумблеров палитр материалов
            const toggleButtons = document.querySelectorAll('.btn-toggle');
            toggleButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const layerName = this.getAttribute('data-layer');
                    this.classList.toggle('active');
                    
                    // Меняем статус палитры (true/false) и обновляем экран
                    activePalettes[layerName] = this.classList.contains('active');
                    updateVisibilityMatrix();
                });
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Официальный старт
        init();
        animate();
    </script>
</body>
</html>
