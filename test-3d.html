<!-- ИНТЕРФЕЙС ПЕЧНОГО ПЛЕЕРА v1.1 -->

<!-- Контейнер для 3D-холста -->
<div id="pechnik-canvas-container">
  <div id="pechnik-loader-status">ЗАГРУЗКА 3D МОДЕЛИ...</div>
  <!-- Визуальный счетчик загруженности сессии над плеером -->
  <div id="pechnik-telemetry-hud">WebGL Status: Инициализация...</div>
  <canvas id="pechnik-webgl-canvas"></canvas>
</div>

<!-- Нижний пульт управления -->
<div id="pechnik-monolith-ui" class="pechnik-bottom-panel">
  <!-- Управление рядами -->
  <div class="pechnik-ui-row row-main-controls">
    <span id="test-layer-counter">РЯД: 54 / 54</span>
    <div class="mode-toggles">
      <button id="test-btn-accum" class="test-ui-btn active" data-mode="ACCUMULATIVE">Сборка</button>
      <button id="test-btn-strict" class="test-ui-btn" data-mode="STRICT">Рентген</button>
    </div>
  </div>

  <!-- Слайдер -->
  <div class="pechnik-ui-row slider-wrapper">
    <input type="range" id="test-order-range" min="1" max="54" value="54" step="1">
  </div>
  
  <!-- Сетка фильтров материалов -->
  <div class="pechnik-material-grid">
    <button class="mat-btn active" data-tag="palette_brick_facade"><span class="color-dot facade"></span>Фасад</button>
    <button class="mat-btn active" data-tag="palette_brick_building"><span class="color-dot building"></span>Забутовка</button>
    <button class="mat-btn active" data-tag="palette_brick_refractory"><span class="color-dot refractory"></span>Шамот</button>
    <button class="mat-btn active" data-tag="palette_iron"><span class="color-dot iron"></span>Литье</button>
    <button class="mat-btn active" data-tag="finish_table"><span class="color-dot table"></span>Столешница</button>
    <button class="mat-btn active" data-tag="finish_misc"><span class="color-dot misc"></span>Отделка</button>
  </div>
</div>
<style>
/* Стили контейнера 3D-графики */
#pechnik-canvas-container {
  width: 100%;
  height: 500px;
  background: #111;
  position: relative;
  overflow: hidden;
}
#pechnik-webgl-canvas {
  width: 100%;
  height: 100%;
  display: block;
}
#pechnik-loader-status {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  color: #ff5722;
  font-family: sans-serif;
  font-weight: bold;
  z-index: 5;
}
/* Стили панели телеметрии нагрузки */
#pechnik-telemetry-hud {
  position: absolute;
  top: 10px; left: 10px;
  background: rgba(0, 0, 0, 0.75);
  padding: 6px 10px;
  font-family: monospace;
  font-size: 11px;
  color: #00ffcc;
  border-radius: 4px;
  border: 1px solid #333;
  pointer-events: none;
  z-index: 4;
}

/* Нижний пульт управления под большой палец */
.pechnik-bottom-panel { 
  background: rgba(15, 15, 15, 0.98); 
  border-top: 3px solid #ff5722; 
  padding: 15px; 
  font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
  color: #fff; 
  width: 100%; 
  box-sizing: border-box; 
}
.pechnik-ui-row { display: flex; align-items: center; margin-bottom: 12px; justify-content: space-between; }
#test-layer-counter { font-size: 18px; font-weight: bold; color: #ff5722; letter-spacing: 0.5px; }
.mode-toggles { display: flex; gap: 8px; }
.test-ui-btn { 
  background: #2b2b2b; border: 1px solid #444; color: #fff; 
  padding: 8px 16px; font-size: 13px; border-radius: 4px; cursor: pointer; 
}
.test-ui-btn.active { background: #ff5722; border-color: #ff5722; font-weight: bold; }
.slider-wrapper input[type="range"] { width: 100%; height: 10px; accent-color: #ff5722; cursor: pointer; margin: 0; }

/* Адаптивная мобильная сетка кнопок */
.pechnik-material-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.mat-btn { 
  background: #1a1a1a; border: 1px solid #333; color: #aaa; 
  padding: 10px 5px; font-size: 12px; border-radius: 4px; cursor: pointer; 
  display: flex; align-items: center; justify-content: center; gap: 8px; 
}
.mat-btn.active { background: #2d2d2d; border-color: #ff5722; color: #fff; }

/* Цветовая палитра индикаторов SketchUp */
.color-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.color-dot.facade { background: #4caf50; }
.color-dot.building { background: #ff5722; }
.color-dot.refractory { background: #ffeb3b; }
.color-dot.iron { background: #607d8b; }
.color-dot.table { background: #ff9800; }
.color-dot.misc { background: #795548; }
</style>
<!-- Подключение библиотек Core WebGL -->
<script src="https://cloudflare.com"></script>
<script src="https://jsdelivr.net"></script>
<script src="https://jsdelivr.net"></script>

<script>
(function() {
  const container = document.getElementById('pechnik-canvas-container');
  const canvas = document.getElementById('pechnik-webgl-canvas');
  const statusDisplay = document.getElementById('pechnik-loader-status');
  const telemetryHud = document.getElementById('pechnik-telemetry-hud');

  // Инициализация сцены Three.js
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111111);
  window.pechnikThreeScene = scene;

  const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
  camera.position.set(5, 5, 8);

  const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.maxPolarAngle = Math.PI / 2 - 0.01;

  // Освещение
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(5, 10, 7);
  scene.add(dirLight);

  // Состояние пульта
  let currentLayer = 54;
  let displayMode = 'ACCUMULATIVE';
  const activeMaterials = { palette_brick_facade: true, palette_brick_building: true, palette_brick_refractory: true, palette_iron: true, finish_table: true, finish_misc: true };

  // Логика фильтрации
  window.hardSyncModel = function() {
    if (!window.pechnikThreeScene) return;
    window.pechnikThreeScene.traverse((obj) => {
      if (obj.isMesh) {
        let rowNum = null;
        let matTag = null;

        const nameScan = (obj.name + " " + (obj.parent ? obj.parent.name : "")).toLowerCase();
        const match = nameScan.match(/(ряд|row|r)_*(\d+)/);
        if (match) rowNum = parseInt(match[2]);

        const checkTags = ['palette_brick_facade', 'palette_brick_building', 'palette_brick_refractory', 'palette_iron', 'finish_table', 'finish_misc'];
        checkTags.forEach(tag => {
          if (nameScan.includes(tag.toLowerCase()) || (obj.userData && JSON.stringify(obj.userData).toLowerCase().includes(tag.toLowerCase()))) {
            matTag = tag;
          }
        });

        let rowVisible = true;
        if (rowNum !== null) {
          rowVisible = (displayMode === 'ACCUMULATIVE') ? (rowNum <= currentLayer) : (rowNum === currentLayer);
        }

        let matVisible = true;
        if (matTag && activeMaterials[matTag] !== undefined) {
          matVisible = activeMaterials[matTag];
        }

        obj.visible = rowVisible && matVisible;
      }
    });
  };

  // Загрузка инженерного слепка модели
  const loader = new THREE.GLTFLoader();
  loader.load(
    'https://pechnik-novosib.ru/public_html/test3d',
    function(gltf) {
      const model = gltf.scene;
      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      
      model.position.x += (model.position.x - center.x);
      model.position.z += (model.position.z - center.z);
      model.position.y -= box.min.y; 
      
      controls.target.set(0, (box.max.y - box.min.y) / 2, 0);
      scene.add(model);
      statusDisplay.style.display = 'none';
      window.hardSyncModel();
      
      // Выводим аудит сессии после полной загрузки
      logSessionLoad(renderer, scene);
    },
    function(xhr) {
      if (xhr.total > 0) {
        statusDisplay.innerText = `ЗАГРУЗКА: ${Math.round((xhr.loaded / xhr.total) * 100)}%`;
      }
    }
  );

  // ФУНКЦИЯ КОНТРОЛЯ ЗАГРУЖЕННОСТИ СЕССИИ (ТЕЛЕМЕТРИЯ)
  function logSessionLoad(webglRenderer, activeScene) {
    const info = webglRenderer.info; 
    // Считаем полигоны (треугольники) печи в текущем кадре
    const triangles = info.render.triangles;
    const geometries = info.memory.geometries;
    const textures = info.memory.textures;

    // Выводим в HUD на экране
    telemetryHud.innerText = `Полигоны: ${triangles} | Геометрии: ${geometries} | Текстуры: ${textures}`;
    
    // Жёсткий аудит в консоль разработчика (F12 -> Console)
    console.log("=== PECHNIK HUB: АУДИТ НАГРУЗКИ СЕССИИ ===");
    console.log(`[Память] Загружено 3D объектов: ${geometries} шт.`);
    console.log(`[Память] Активных текстур в GPU: ${textures} шт.`);
    console.log(`[Рендер] Всего треугольников (Полигонаж): ${triangles}`);
    if (triangles > 300000) {
      console.warn("ВНИМАНИЕ: Модель слишком тяжелая для слабых смартфонов (>300k полигонов). Нужен плагин CleanUp!");
    } else {
      console.log("Статус производительности: ОТЛИЧНО. Плеер будет летать.");
    }
    console.log("=========================================");
  }

  // Рендер-цикл
  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  }, false);

  // Инициализация кнопок UI панели
  document.addEventListener("DOMContentLoaded", () => {
    const slider = document.getElementById('test-order-range');
    const counter = document.getElementById('test-layer-counter');
    
    slider.addEventListener('input', (e) => {
      currentLayer = parseInt(e.target.value);
      counter.innerText = `РЯД: ${currentLayer} / 54`;
      window.hardSyncModel();
      logSessionLoad(renderer, scene); // Обновляем нагрузку при переключении рядов
    });

    document.getElementById('test-btn-accum').addEventListener('click', function() {
      this.classList.add('active'); document.getElementById('test-btn-strict').classList.remove('active');
      displayMode = 'ACCUMULATIVE'; window.hardSyncModel(); logSessionLoad(renderer, scene);
    });

    document.getElementById('test-btn-strict').addEventListener('click', function() {
      this.classList.add('active'); document.getElementById('test-btn-accum').classList.remove('active');
      displayMode = 'STRICT'; window.hardSyncModel(); logSessionLoad(renderer, scene);
    });

    document.querySelectorAll('.pechnik-material-grid .mat-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        const tag = this.getAttribute('data-tag');
        this.classList.toggle('active');
        activeMaterials[tag] = this.classList.contains('active');
        window.hardSyncModel();
        logSessionLoad(renderer, scene);
      });
    });
  });
})();
</script>
